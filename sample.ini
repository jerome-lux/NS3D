# =====================================================================
#  NS3D - sample input file
#
#  One 'key = value' per line.
#  - keys are case-insensitive;
#  - blank lines and lines starting with '#' are ignored;
#  - an inline '# ...' comment is allowed after a value;
#  - unknown keys are reported as a warning;
#  - all keys except 'input' have a default value (see 'NS3D -h').
# =====================================================================

# --- files -----------------------------------------------------------
# binary image of the microstructure (0 = fluid, 1 = solid), .vti or .vtk
input = my_porous_image.vti

# initial pressure field (optional; default: linear profile from p0 to p1)
#pressurefield = P-1-my_porous_image.vti
# initial velocity fields (optional; default: zero)
#vxfield = Vx-1-my_porous_image.vti
#vyfield = Vy-1-my_porous_image.vti
#vzfield = Vz-1-my_porous_image.vti

# --- physics ----------------------------------------------------------
dx    = 2e-6    # grid spacing along x (m)
dy    = -1      # grid spacing along y (m); negative value -> same as dx
dz    = -1      # grid spacing along z (m); negative value -> same as dx
mu    = 1e-3    # dynamic viscosity (Pa.s)
rho   = 1e3     # density (kg/m^3)
p0    = 1e5     # inlet pressure (Pa)
gradp = 1e2     # imposed pressure gradient (Pa/m)

# --- numerics ---------------------------------------------------------
alpha       = 0.8     # velocity relaxation parameter
beta        = 1.0     # pressure relaxation parameter
vsolvertol  = 1e-5    # velocity solver tolerance
psolvertol  = 1e-6    # pressure solver tolerance
pcsolvertol = 1e-3    # pressure correction solver tolerance
simpletol   = 1e-4    # outer-loop convergence threshold (relative RMR)
deltaRMR    = 1e-4    # oscillation detection threshold
maxitsolver = 1000    # max iterations of the linear solvers
maxitSIMPLE = 500     # max outer iterations
N1          = 2       # inner pressure iterations (SIMPLER / SIMPLERR / IDEAL)
N2          = 2       # inner final iterations (IDEAL)

# --- geometry ----------------------------------------------------------
porevalue = 0    # voxel value that represents the fluid (0 or 1)
direction = 1    # pressure gradient direction: 1 = x, 2 = y, 3 = z
border    = 0    # solid border thickness added along x (voxels)

# --- algorithm ----------------------------------------------------------
method = SIMPLEC   # SIMPLEC | SIMPLER | SIMPLERR | IDEAL
