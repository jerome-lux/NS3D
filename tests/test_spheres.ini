# =====================================================================
#  NS3D - test configuration: flow through a sphere pack
#
#  Runs the solver on the 128^3 image of non-overlapping spheres
#  generated by gen_spheres (data/spheres_128.vti):
#      0 = fluid (the inter-sphere matrix)
#      1 = solid (the spheres)
#
#  This file is consumed by the CTest target 'test_spheres' (see
#  tests/CMakeLists.txt). The image path is relative to the repository
#  root; the test working directory is set accordingly.
#
#  The iteration budget is intentionally modest: the goal of the test is
#  to exercise the full pipeline (image -> index arrays -> solvers ->
#  Darcy permeability) on a 128^3 geometry, not to run to machine
#  precision. Raise maxitSIMPLE for a converged reference value.
# =====================================================================

# --- files -----------------------------------------------------------
input = data/spheres_128.vti

# --- physics ----------------------------------------------------------
dx    = 2e-6    # grid spacing along x (m)
dy    = -1      # same as dx
dz    = -1      # same as dx
mu    = 1e-3    # dynamic viscosity (Pa.s)
rho   = 1e3     # density (kg/m^3)
p0    = 1e5     # inlet pressure (Pa)
gradp = 1e2     # imposed pressure gradient (Pa/m)

# --- numerics ---------------------------------------------------------
alpha       = 0.8     # velocity relaxation parameter
beta        = 1.0     # pressure relaxation parameter
vsolvertol  = 1e-5    # velocity solver tolerance
psolvertol  = 1e-6    # pressure solver tolerance
pcsolvertol = 1e-3    # pressure correction solver tolerance
simpletol   = 1e-4    # outer-loop convergence threshold (relative RMR)
deltaRMR    = 1e-4    # oscillation detection threshold
maxitsolver = 500     # max iterations of the linear solvers
maxitSIMPLE = 30      # max outer iterations (modest, for a fast test)
N1          = 2       # inner pressure iterations (SIMPLER / SIMPLERR / IDEAL)
N2          = 2       # inner final iterations (IDEAL)

# --- geometry ----------------------------------------------------------
porevalue = 0    # voxel value that represents the fluid (0 or 1)
direction = 1    # pressure gradient direction: 1 = x
border    = 0    # solid border thickness added along x (voxels)

# --- algorithm ----------------------------------------------------------
method = SIMPLEC   # SIMPLEC | SIMPLER | SIMPLERR | IDEAL
