# =====================================================================
#  NS3D - algorithm-comparison configuration (base)
#
#  Used by tests/compare_algorithms.sh, which runs the SAME setup with
#  each of the four outer-loop algorithms (SIMPLEC, SIMPLER, SIMPLERR,
#  IDEAL) and compares their Darcy permeability, iteration count,
#  wall-clock time and convergence on a SMALL (64^3) sphere image so
#  that a full convergence check is affordable.
#
#  The script overrides the 'method' line for every run; every other
#  value below is shared by all four algorithms.
#
#  The iteration budget is deliberately larger than the single-geometry
#  test (tests/test_spheres.ini) so that convergence (RMR < simpletol)
#  can actually be checked. Raise maxitSIMPLE for a stricter run.
# =====================================================================

# --- files -----------------------------------------------------------
input = data/spheres_64.vti

# --- physics ----------------------------------------------------------
dx    = 2e-6    # grid spacing along x (m)
dy    = -1      # same as dx
dz    = -1      # same as dx
mu    = 1e-3    # dynamic viscosity (Pa.s)
rho   = 1e3     # density (kg/m^3)
p0    = 1e5     # inlet pressure (Pa)
gradp = 1e2     # imposed pressure gradient (Pa/m)

# --- numerics ---------------------------------------------------------
alpha       = 0.8     # velocity relaxation parameter
beta        = 1.0     # pressure relaxation parameter
vsolvertol  = 1e-5    # velocity solver tolerance
psolvertol  = 1e-6    # pressure solver tolerance
pcsolvertol = 1e-3    # pressure correction solver tolerance
simpletol   = 1e-4    # outer-loop convergence threshold (relative RMR)
deltaRMR    = 1e-4    # oscillation detection threshold
maxitsolver = 500     # max iterations of the linear solvers
maxitSIMPLE = 200     # max outer iterations (large enough to check convergence)
N1          = 2       # inner pressure iterations (SIMPLER / SIMPLERR / IDEAL)
N2          = 2       # inner final iterations (IDEAL)

# --- geometry ----------------------------------------------------------
porevalue = 0    # voxel value that represents the fluid (0 or 1)
direction = 1    # pressure gradient direction: 1 = x
border    = 0    # solid border thickness added along x (voxels)

# --- algorithm ----------------------------------------------------------
method = SIMPLEC   # overridden per run by tests/compare_algorithms.sh
